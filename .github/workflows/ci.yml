name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "v*"
      - "feature/*"
      - "fix/*"

jobs:
  lint_and_test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit/integration tests
        run: cargo test --all-targets --all-features

  coverage:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage
        run: |
          cargo tarpaulin \
            --engine llvm \
            --all-targets \
            --all-features \
            --follow-exec \
            --out Xml \
            --output-dir coverage \
            --fail-under 70 \
            -- \
            --test-threads=1

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/cobertura.xml

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run snapshot regression tests
        run: cargo test --test snapshot_tests

      - name: Run fixture regression tests
        run: cargo test --test catalog_fixture_tests

      - name: Run precision regression tests
        run: cargo test --test rule_precision_tests

      - name: Run catalog rule matrix tests
        run: cargo test --test catalog_rule_matrix

  packaging:
    name: Maturin packaging smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist --sdist --find-interpreter
          sccache: "true"
          manylinux: "2_28"

      - name: Install wheel and smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-packaging
          source .venv-packaging/bin/activate
          pip install --upgrade pip
          pip install dist/zerum-*.whl
          zerum --help
          zerum list-checks | head
          zerum check tests/fixtures/clean_project
          # bad_project must exit 1 (issues found)
          set +e
          zerum check tests/fixtures/bad_project
          status=$?
          set -e
          test "$status" -eq 1

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-dist
          path: dist/*
          retention-days: 7
