name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "v*"
      - "feature/*"
      - "fix/*"

jobs:
  lint_and_test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit/integration tests
        run: cargo test --all-targets --all-features

  coverage:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out Xml --output-dir coverage -- --test-threads=1

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/cobertura.xml

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run snapshot regression tests
        run: cargo test --test snapshot_tests

      - name: Run fixture regression tests
        run: cargo test --test catalog_fixture_tests

      - name: Run precision regression tests
        run: cargo test --test rule_precision_tests
