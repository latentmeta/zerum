[package]
name = "zerum"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Deterministic-first Python code governance: native checks (ZR001–ZR010), CLI, and SARIF/JSON reporters"
license = "MIT"
readme = "README.md"
repository = "https://github.com/latentmeta/zerum"
homepage = "https://github.com/latentmeta/zerum"
documentation = "https://docs.rs/zerum"
keywords = ["python", "lint", "static-analysis", "governance", "sarif"]
categories = ["development-tools", "command-line-utilities"]
authors = ["thanos vassilakis"]

[lib]
name = "zerum"
path = "src/lib.rs"

[[bin]]
name = "zerum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustpython-ast = "0.4"
rustpython-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"
