[package]
name = "zerum"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "Deterministic Python code governance: ~75 checks, default/strict profiles, explain mode, optional Ruff orchestration"
license = "MIT"
readme = "README.md"
repository = "https://github.com/latentmeta/zerum"
homepage = "https://github.com/latentmeta/zerum"
documentation = "https://docs.rs/zerum"
keywords = ["python", "lint", "static-analysis", "governance", "credo"]
categories = ["development-tools", "command-line-utilities"]
authors = ["thanos vassilakis"]
exclude = [
    "/tests/",
    "/plans/",
    "/prompts/",
    "/reviews/",
    "/NOTES.md",
    "/.github/",
]

[lib]
name = "zerum"
path = "src/lib.rs"

[[bin]]
name = "zerum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustpython-ast = "0.4"
rustpython-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[features]
default = []
sarif = []

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"
