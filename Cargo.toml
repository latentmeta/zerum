[package]
name = "zerum"
version = "0.1.0"
edition = "2021"
description = "Deterministic code governance with external checker orchestration and auditable LLM review"
license = "MIT"
readme = "README.md"

[lib]
name = "zerum"
path = "src/lib.rs"

[[bin]]
name = "zerum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustpython-ast = "0.4"
rustpython-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"
