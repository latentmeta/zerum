# Zerum PyPI packaging — maturin bin bindings
#
# Python is the distribution channel only. Zerum remains a Rust CLI.
# End users get a prebuilt `zerum` executable on PATH; no Rust toolchain required.
#
# Docs: docs/packaging/ (INSTALL.md, CI_CD.md, RELEASING_PYPI.md, VERIFICATION.md)

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "zerum"
# Keep in sync with Cargo.toml [package].version (single source of truth for releases).
version = "0.4.0"
description = "Deterministic Python code governance: ~75 checks, default/strict profiles, explain mode, optional Ruff orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thanos vassilakis" }]
keywords = [
    "python",
    "lint",
    "static-analysis",
    "governance",
    "credo",
    "cli",
    "zerum",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Pure CLI wheel: no Python runtime dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/latentmeta/zerum"
Repository = "https://github.com/latentmeta/zerum"
Documentation = "https://github.com/latentmeta/zerum/tree/main/docs"
Changelog = "https://github.com/latentmeta/zerum/blob/main/CHANGELOG.md"
Issues = "https://github.com/latentmeta/zerum/issues"
"Release Notes" = "https://github.com/latentmeta/zerum/releases"

[tool.maturin]
# Explicit: Cargo.toml has both [lib] and [[bin]]. Without this, maturin would
# not auto-detect bin-only packaging (it prefers pyo3/cdylib when a lib exists).
bindings = "bin"
manifest-path = "Cargo.toml"
# Strip symbols in release wheels for smaller artifacts.
strip = true
# Prefer PyPI-accepted platform tags (manylinux / macOS / Windows).
# Pass --locked on the CLI / in CI for reproducible Cargo.lock builds.
compatibility = "pypi"
# Include release notes and examples in the sdist for source rebuilds.
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "zerum.toml.example", format = ["sdist", "wheel"] },
    { path = "zerum.toml.strict.example", format = ["sdist", "wheel"] },
    { path = "docs/**/*", format = "sdist" },
]

# Trusted Publishing for `maturin generate-ci` / release workflow.
[tool.maturin.generate-ci.github]
trusted-publishing = true
publishing-environment = "pypi"
